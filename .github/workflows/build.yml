
    name: WASEET AL-KHAIR 3 APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.1.8937393
      ANDROIDNDK: /usr/local/lib/android/sdk/ndk/25.1.8937393
      ANDROIDAPI: 33
      ANDROIDMINAPI: 21

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            build-essential \
            autoconf libtool pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install SDK and NDK
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;25.1.8937393"

          test -d "$ANDROID_NDK_HOME"
          echo "NDK selected:"
          cat "$ANDROID_NDK_HOME/source.properties"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Cython==0.29.33"
          python -m pip install buildozer

      - name: Configure Buildozer NDK
        run: |
          grep -q '^android.ndk = 25b' buildozer.spec

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WASEET-AL-KHAIR-3
          path: bin/*.apk
          if-no-files-found: error
